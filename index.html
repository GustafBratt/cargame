<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Sandbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="hud-panel hud-p1">
      <div class="hud-title">P1 &mdash; WASD</div>
      <div id="p1-speed">0 mph</div>
      <div id="p1-score" class="hud-score">Coins: 0</div>
      <div id="p1-status" class="hud-status">Race for the coin!</div>
    </div>
    <div class="hud-panel hud-p2">
      <div class="hud-title">P2 &mdash; IJKL</div>
      <div id="p2-speed">0 mph</div>
      <div id="p2-score" class="hud-score">Coins: 0</div>
      <div id="p2-status" class="hud-status">Race for the coin!</div>
    </div>
  </div>

  <div class="hint">R to reset &middot; race for the coin, then parallel park in a "P" spot to release the next one</div>

  <script src="game.js"></script>
</body>
</html>
