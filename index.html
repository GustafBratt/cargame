<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rådhusgatan Rumble</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="hud-panel hud-p1">
      <div class="hud-row">
        <span class="hud-coins"><span class="coin-icon"></span><span id="p1-score">0</span></span>
        <span id="p1-keys" class="hud-text">WASD</span>
        <button id="p1-auto" class="auto-btn" type="button" aria-pressed="false">Autopilot</button>
      </div>
      <div class="hud-row hud-sub">
        <span id="p1-phase" class="hud-text" title="Game phase : the coin you're about to take">1:1</span>
        <span id="p1-next" class="hud-text">Next: Coin</span>
      </div>
    </div>
    <div class="hud-panel hud-p2">
      <div class="hud-row">
        <button id="p2-auto" class="auto-btn" type="button" aria-pressed="false">Autopilot</button>
        <span id="p2-keys" class="hud-text">IJKL / Arrows</span>
        <span class="hud-coins"><span class="coin-icon"></span><span id="p2-score">0</span></span>
      </div>
      <div class="hud-row hud-sub">
        <span id="p2-phase" class="hud-text" title="Game phase : the coin you're about to take">1:1</span>
        <span id="p2-next" class="hud-text">Next: Coin</span>
      </div>
    </div>
  </div>

  <div id="hint" class="hint"><strong class="hint-title">Rådhusgatan Rumble</strong> &middot; Race for coins &middot; every 3 coins a new phase: parallel parking, then a caravan, then camping &middot; stop at the garage to repair for 1 coin</div>

  <script src="game.js"></script>
</body>
</html>
