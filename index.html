<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Sandbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="hud-panel hud-p1">
      <span id="p1-title" class="hud-title">P1 &mdash; WASD</span>
      <span class="hud-coins"><span class="coin-icon"></span><span id="p1-score">0</span></span>
    </div>
    <div class="hud-panel hud-p2">
      <span class="hud-coins"><span class="coin-icon"></span><span id="p2-score">0</span></span>
      <span id="p2-title" class="hud-title">P2 &mdash; IJKL / Arrows</span>
    </div>
  </div>

  <div id="hint" class="hint">Race for the coin, then parallel park in a "P" spot to release the next one &middot; stop at the garage to repair for 1 coin</div>

  <script src="game.js"></script>
</body>
</html>
